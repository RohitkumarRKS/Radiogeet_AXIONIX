<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#76FF03;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer hexagon -->
  <polygon points="100,10 178,55 178,145 100,190 22,145 22,55" 
           fill="none" stroke="url(#logoGrad)" stroke-width="4" filter="url(#glow)"/>
  <!-- Inner hexagon (rotated) -->
  <polygon points="100,40 155,70 155,130 100,160 45,130 45,70" 
           fill="none" stroke="url(#logoGrad)" stroke-width="3"/>
  <!-- Center circle -->
  <circle cx="100" cy="100" r="20" fill="url(#logoGrad)" opacity="0.9"/>
  <!-- Connection nodes -->
  <circle cx="100" cy="40" r="8" fill="url(#logoGrad)"/>
  <circle cx="155" cy="70" r="8" fill="url(#logoGrad)"/>
  <circle cx="155" cy="130" r="8" fill="url(#logoGrad)"/>
  <circle cx="100" cy="160" r="8" fill="url(#logoGrad)"/>
  <circle cx="45" cy="130" r="8" fill="url(#logoGrad)"/>
  <circle cx="45" cy="70" r="8" fill="url(#logoGrad)"/>
  <!-- Connection lines to center -->
  <line x1="100" y1="40" x2="100" y2="80" stroke="url(#logoGrad)" stroke-width="2" opacity="0.7"/>
  <line x1="155" y1="70" x2="120" y2="90" stroke="url(#logoGrad)" stroke-width="2" opacity="0.7"/>
  <line x1="155" y1="130" x2="120" y2="110" stroke="url(#logoGrad)" stroke-width="2" opacity="0.7"/>
  <line x1="100" y1="160" x2="100" y2="120" stroke="url(#logoGrad)" stroke-width="2" opacity="0.7"/>
  <line x1="45" y1="130" x2="80" y2="110" stroke="url(#logoGrad)" stroke-width="2" opacity="0.7"/>
  <line x1="45" y1="70" x2="80" y2="90" stroke="url(#logoGrad)" stroke-width="2" opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="100" cy="100" r="6" fill="#0a0e1a"/>
  <circle cx="100" cy="100" r="4" fill="url(#logoGrad)"/>
</svg>
